<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - HASSION Leather</title>
    <meta name="description" content="Thank you for contacting HASSION Leather. Our team will reply to your OEM leather goods inquiry soon.">
    <link rel="icon" type="image/gif" href="images/logo.gif">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333333;
            background: #FDFBF7;
            line-height: 1.7;
        }

        .thanks-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .thanks-content {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .brand-logo {
            width: 138px;
            height: auto;
            margin: 0 auto 30px;
        }

        h1 {
            color: #5C2D1A;
            font-size: 2.2rem;
            line-height: 1.2;
            margin: 0 0 16px;
        }

        p {
            max-width: 520px;
            margin: 0 auto;
            color: #555;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 34px;
        }

        .btn {
            display: inline-block;
            min-width: 180px;
            padding: 13px 26px;
            border: 2px solid transparent;
            border-radius: 6px;
            font-size: 0.96rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .btn-primary {
            background: #25D366;
            border-color: #25D366;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1ea84d;
            border-color: #1ea84d;
        }

        .btn-outline {
            background: transparent;
            border-color: #5C2D1A;
            color: #5C2D1A;
        }

        .btn-outline:hover {
            background: #5C2D1A;
            color: #fff;
        }

        @media (max-width: 520px) {
            .thanks-page {
                padding: 38px 18px;
            }

            .brand-logo {
                width: 124px;
                margin-bottom: 24px;
            }

            h1 {
                font-size: 1.75rem;
            }

            p {
                font-size: 0.94rem;
            }

            .actions {
                gap: 12px;
                margin-top: 28px;
            }

            .btn {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <main class="thanks-page">
        <section class="thanks-content" aria-labelledby="thanks-title">
            <img class="brand-logo" src="images/logo.gif" alt="HASSION Leather" width="172" height="86">
            <h1 id="thanks-title">Thank you for your inquiry</h1>
            <p>Your message has been received. The HASSION team will review your OEM leather goods request and reply as soon as possible.</p>
            <div class="actions">
                <a class="btn btn-primary" href="https://wa.me/8613925017288?text=Hello%20HASSION%2C%20I%20just%20submitted%20an%20inquiry%20from%20your%20website.%20Please%20help%20confirm%20the%20details." target="_blank" rel="noopener">Chat on WhatsApp</a>
                <a class="btn btn-outline" href="index.html">Back to Homepage</a>
            </div>
        </section>
    </main>
</body>
</html>
